name: Build OpenReadest APK (滑动翻页 / Swipe to Paginate)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Apply swipe-to-paginate patch
        run: |
          cat > /tmp/swipe.patch <<'PATCH_EOF'
          diff --git a/apps/openreadest-app/src/types/book.ts b/apps/openreadest-app/src/types/book.ts
          --- a/apps/openreadest-app/src/types/book.ts
          +++ b/apps/openreadest-app/src/types/book.ts
          @@ -110,6 +110,7 @@
             gapPercent: number;
             scrolled: boolean;
             disableClick: boolean;
          +  swipeToPaginate: boolean;
             fullscreenClickArea: boolean;
             swapClickArea: boolean;
             disableDoubleClick: boolean;
          diff --git a/apps/openreadest-app/src/services/constants.ts b/apps/openreadest-app/src/services/constants.ts
          --- a/apps/openreadest-app/src/services/constants.ts
          +++ b/apps/openreadest-app/src/services/constants.ts
          @@ -148,6 +148,7 @@
             gapPercent: 5,
             scrolled: false,
             disableClick: false,
          +  swipeToPaginate: true,
             fullscreenClickArea: false,
             swapClickArea: false,
             disableDoubleClick: false,
          diff --git a/apps/openreadest-app/src/components/settings/ControlPanel.tsx b/apps/openreadest-app/src/components/settings/ControlPanel.tsx
          --- a/apps/openreadest-app/src/components/settings/ControlPanel.tsx
          +++ b/apps/openreadest-app/src/components/settings/ControlPanel.tsx
          @@ -32,6 +32,7 @@
             const [scrollingOverlap, setScrollingOverlap] = useState(viewSettings.scrollingOverlap);
             const [volumeKeysToFlip, setVolumeKeysToFlip] = useState(viewSettings.volumeKeysToFlip);
             const [isDisableClick, setIsDisableClick] = useState(viewSettings.disableClick);
          +  const [swipeToPaginate, setSwipeToPaginate] = useState(viewSettings.swipeToPaginate ?? true);
             const [fullscreenClickArea, setFullscreenClickArea] = useState(viewSettings.fullscreenClickArea);
             const [swapClickArea, setSwapClickArea] = useState(viewSettings.swapClickArea);
             const [isDisableDoubleClick, setIsDisableDoubleClick] = useState(viewSettings.disableDoubleClick);
          @@ -58,6 +59,7 @@
                 scrollingOverlap: setScrollingOverlap,
                 volumeKeysToFlip: setVolumeKeysToFlip,
                 disableClick: setIsDisableClick,
          +      swipeToPaginate: setSwipeToPaginate,
                 swapClickArea: setSwapClickArea,
                 animated: setAnimated,
                 isEink: setIsEink,
          @@ -115,6 +117,22 @@
             }, [isDisableClick]);
           
             useEffect(() => {
          +    // The foliate paginator reads `no-swipe` on every touchmove/touchend, so the
          +    // attribute has to be updated immediately when the setting changes instead
          +    // of waiting for the viewer to be recreated.
          +    const renderer = getView(bookKey)?.renderer;
          +    if (renderer) {
          +      if (swipeToPaginate) {
          +        renderer.removeAttribute('no-swipe');
          +      } else {
          +        renderer.setAttribute('no-swipe', '');
          +      }
          +    }
          +    saveViewSettings(envConfig, bookKey, 'swipeToPaginate', swipeToPaginate, false, false);
          +    // eslint-disable-next-line react-hooks/exhaustive-deps
          +  }, [swipeToPaginate]);
          +
          +  useEffect(() => {
               saveViewSettings(envConfig, bookKey, 'disableDoubleClick', isDisableDoubleClick, false, false);
               // eslint-disable-next-line react-hooks/exhaustive-deps
             }, [isDisableDoubleClick]);
          @@ -266,6 +284,15 @@
                         />
                       </div>
                       <div className='config-item'>
          +              <span className=''>{_('Swipe to Paginate')}</span>
          +              <input
          +                type='checkbox'
          +                className='toggle'
          +                checked={swipeToPaginate}
          +                onChange={() => setSwipeToPaginate(!swipeToPaginate)}
          +              />
          +            </div>
          +            <div className='config-item'>
                         <span className=''>
                           {appService?.isMobileApp ? _('Tap Both Sides') : _('Click Both Sides')}
                         </span>
          diff --git a/apps/openreadest-app/src/app/reader/components/FoliateViewer.tsx b/apps/openreadest-app/src/app/reader/components/FoliateViewer.tsx
          --- a/apps/openreadest-app/src/app/reader/components/FoliateViewer.tsx
          +++ b/apps/openreadest-app/src/app/reader/components/FoliateViewer.tsx
          @@ -367,6 +367,13 @@
                 } else {
                   view.renderer.removeAttribute('animated');
                 }
          +      // Let the foliate paginator know whether horizontal swipes may turn pages.
          +      // Its touchmove/touchend handlers check `no-swipe` before paging.
          +      if (viewSettings.swipeToPaginate === false) {
          +        view.renderer.setAttribute('no-swipe', '');
          +      } else {
          +        view.renderer.removeAttribute('no-swipe');
          +      }
                 if (appService?.isAndroidApp) {
                   if (eink) {
                     view.renderer.setAttribute('eink', '');
          diff --git a/apps/openreadest-app/src/app/reader/hooks/usePagination.ts b/apps/openreadest-app/src/app/reader/hooks/usePagination.ts
          --- a/apps/openreadest-app/src/app/reader/hooks/usePagination.ts
          +++ b/apps/openreadest-app/src/app/reader/hooks/usePagination.ts
          @@ -213,6 +213,7 @@
                   }
                 } else if (
                   msg.type === 'touch-swipe' &&
          +        viewSettings?.swipeToPaginate !== false &&
                   bookData.isFixedLayout &&
                   !isPanningView(viewRef.current, viewSettings)
                 ) {
