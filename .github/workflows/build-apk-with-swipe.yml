      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      # The runner already ships a working sdkmanager under
      # $ANDROID_HOME/cmdline-tools/latest (see upstream build.yml).
      - name: install NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "ndk;28.2.13676358"

      - name: install Rust stable with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: android-cargo

      - name: install dependencies
        run: pnpm install

      - name: copy vendored assets
        run: pnpm --filter @openreadest/app setup-vendors

      - name: prepare env
        run: |
          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" >> .env.local
          cp .env.local apps/openreadest-app/.env.local

      - name: init Android project and signing config
        working-directory: apps/openreadest-app
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          pushd src-tauri/gen/android
          KEYSTORE="$RUNNER_TEMP/openreadest.keystore"
          keytool -genkeypair -v -keystore "$KEYSTORE" \
            -storepass openreadest123 -keypass openreadest123 \
            -alias openreadest -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=OpenReadest, OU=OpenReadest, O=OpenReadest, C=CN"
          echo "keyAlias=openreadest" > keystore.properties
          echo "password=openreadest123" >> keystore.properties
          echo "storeFile=$KEYSTORE" >> keystore.properties
          popd

      - name: build universal APK
        working-directory: apps/openreadest-app
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          pnpm tauri android build --apk

      - name: sign universal APK
        working-directory: apps/openreadest-app
        run: |
          APK_DIR=src-tauri/gen/android/app/build/outputs/apk/universal/release
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/openreadest.keystore" \
            --ks-pass pass:openreadest123 \
            --key-pass pass:openreadest123 \
            --out "$APK_DIR/OpenReadest_swipe_universal.apk" \
            "$APK_DIR/app-universal-release-unsigned.apk"
          ls -la "$APK_DIR"

      - name: upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenReadest-swipe-apk
          path: apps/openreadest-app/src-tauri/gen/android/app/build/outputs/apk/universal/release/OpenReadest_swipe_universal.apk
          if-no-files-found: error
