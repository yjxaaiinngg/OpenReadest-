name: 生成固定签名密钥 (一次性)

# Run this ONCE. It creates a signing keystore and prints its base64 in the log.
# Copy the base64 between the markers into a repo Secret named: ANDROID_KEYSTORE_B64

on:
  workflow_dispatch:

jobs:
  gen-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Generate keystore and print base64
        run: |
          KEYSTORE="$RUNNER_TEMP/openreadest-fixed.keystore"
          keytool -genkeypair -v -keystore "$KEYSTORE" \
            -storepass openreadest123 -keypass openreadest123 \
            -alias openreadest -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=OpenReadest, OU=OpenReadest, O=OpenReadest, C=CN"
          echo "==================== KEYSTORE BASE64 START ===================="
          base64 -w 0 "$KEYSTORE"
          echo ""
          echo "==================== KEYSTORE BASE64 END ===================="
          echo "请复制上面两行标记之间的那一大串字符，存为仓库 Secret: ANDROID_KEYSTORE_B64"
          echo "密钥库密码: openreadest123  别名: openreadest  别名密码: openreadest123"
