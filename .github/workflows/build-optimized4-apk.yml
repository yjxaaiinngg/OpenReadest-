          +    // and friends to synthesise fixtures and cross-check the hash.
          +    use crate::parser_common::COVER_MAX_LONG_EDGE;
          +    use image::GenericImageView;
          +    use md5::{Digest, Md5};
          +    use std::io::Cursor;
